<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#glow)" />
  <circle cx="100" cy="100" r="82" fill="#091A14" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="100" cy="100" r="74" fill="#0D281E" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 2" />
  <!-- Eth Diamond -->
  <polygon points="100,45 128,88 100,105 72,88" fill="url(#goldGrad)" opacity="0.9" />
  <polygon points="100,45 72,88 100,105" fill="#FFE066" opacity="0.6" />
  <polygon points="100,113 128,96 100,145 72,96" fill="url(#goldGrad)" opacity="0.8" />
  <polygon points="100,113 72,96 100,145" fill="#D97706" opacity="0.7" />
  <!-- Champion Crown Arc -->
  <path d="M55,145 Q100,170 145,145" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="100" cy="160" r="3" fill="#FFE066" />
  <circle cx="85" cy="158" r="2.5" fill="#FFE066" />
  <circle cx="115" cy="158" r="2.5" fill="#FFE066" />
