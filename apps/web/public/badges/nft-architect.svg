  <line x1="100" y1="92" x2="135" y2="72" stroke="url(#archGrad)" stroke-width="2" />
  <line x1="100" y1="92" x2="65" y2="72" stroke="url(#archGrad)" stroke-width="2" />
  <polygon points="100,92 135,72 100,52 65,72" fill="#34D399" opacity="0.3" />
  <!-- Celestial Orbs -->
  <circle cx="100" cy="155" r="4" fill="#6EE7B7" />
  <circle cx="75" cy="148" r="3" fill="#6EE7B7" />
