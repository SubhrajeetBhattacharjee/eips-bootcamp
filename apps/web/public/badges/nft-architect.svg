      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <radialGradient id="archGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#archGlow)" />
  <circle cx="100" cy="100" r="82" fill="#091A14" stroke="url(#archGrad)" stroke-width="4" />
  <circle cx="100" cy="100" r="74" fill="#042F2E" stroke="#34D399" stroke-width="1.5" stroke-dasharray="4 2" />
