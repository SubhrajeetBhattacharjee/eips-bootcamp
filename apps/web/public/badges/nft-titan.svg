  <!-- Sparkles -->
  <circle cx="60" cy="65" r="2" fill="#E9D5FF" />
  <circle cx="140" cy="65" r="2" fill="#E9D5FF" />
  <circle cx="100" cy="165" r="2.5" fill="#E9D5FF" />
