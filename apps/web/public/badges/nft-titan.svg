      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <radialGradient id="titanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#titanGlow)" />
  <circle cx="100" cy="100" r="82" fill="#091A14" stroke="url(#purpleGrad)" stroke-width="4" />
  <circle cx="100" cy="100" r="74" fill="#140D24" stroke="#C084FC" stroke-width="1.5" stroke-dasharray="2 3" />
  <!-- Titan Diamond -->
