<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <radialGradient id="vetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#vetGlow)" />
  <circle cx="100" cy="100" r="82" fill="#091A14" stroke="url(#amberGrad)" stroke-width="4" />
  <circle cx="100" cy="100" r="74" fill="#1C1608" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 3" />
  <!-- Veteran Laurel & Shield -->
  <polygon points="100,50 130,65 130,110 100,135 70,110 70,65" fill="#291F0B" stroke="url(#amberGrad)" stroke-width="2.5" />
  <polygon points="100,68 118,78 118,105 100,120 82,105 82,78" fill="url(#amberGrad)" opacity="0.8" />
  <!-- Veteran Stars -->
  <polygon points="100,148 102,154 108,154 103,158 105,164 100,160 95,164 97,158 92,154 98,154" fill="#FDE68A" />
</svg>

